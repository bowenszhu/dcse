image: cuda10.2-devel-py

before_script:
  - python3 -V  # Print out python version for debugging
  - python3 -m pip install -r requirements.txt

stages:
  - Static Analysis
  - Build
  - Test

flake8:
  stage: Static Analysis
  script:
    - flake8  --max-line-length 120  --exclude pybind11

pylint:
  stage: Static Analysis
  script:
    - pylint --ignore=pybind11 --max-line-length=120 -d C0114 src

build_linux:
  stage: Build
  tags: 
    - gpu
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  script:
    - cd src/engines
    - make gpu
  artifacts:
      paths:
        - src/engines/*.so
        - src/engines/*.pyd


coverage:
  stage: Test
  script:
    - >
      coverage run --branch --source=src
      --omit=src/main.py,src/scipy_linear_interpolator.py
      -m unittest discover -s tests -p test_*.py -v
    - coverage report -m

test_linux:
  stage: Test
  script:
    - uname -m && cat /etc/*release     # verify supported version of Linux
    - nvidia-smi -q                     # display GPU info
    - gcc --version                     # verify gcc
    - uname -a                          # display system info
    - PYTHONPATH=`pwd` python3 src/main.py
  artifacts:
    paths:
      - interpolation_time_per_point.png
      - interpolation_time_per_point.eps